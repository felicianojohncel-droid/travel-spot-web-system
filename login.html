<!DOCTYPE html>
<html lang="fil">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>LakbayPH | Login</title><link rel="stylesheet" href="style.css"></head>
<body class="auth-page"><main class="auth-shell"><section class="auth-brand"><div class="logo large"><span class="logo-mark">✈</span> Lakbay<span>PH</span></div><h1>Plan your next escape.</h1><p>Discover Philippine destinations, compare estimates, and save your trip in one beautiful place.</p><div class="auth-art">🏝️ 🌅 ⛰️</div></section><section class="auth-panel"><div class="auth-box"><div class="auth-tabs"><button class="auth-tab active" data-mode="login">Log in</button><button class="auth-tab" data-mode="register">Register</button></div><form id="authForm"><h2 id="authTitle">Welcome back!</h2><p id="authHint">Log in first to enter your travel dashboard.</p><label id="nameWrap" class="hidden">Full name<input id="name" type="text" autocomplete="name"></label><label>Email<input id="email" type="email" required autocomplete="email"></label><label>Password<input id="password" type="password" minlength="6" required autocomplete="current-password"></label><button class="primary-button full" type="submit" id="submitButton">Log in</button><p class="form-message" id="message"></p></form><a class="back-link" href="index.html">← Home</a></div></section></main><script src="auth.js"></script></body></html>
